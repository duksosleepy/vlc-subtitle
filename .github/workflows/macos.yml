name: macOS Builds

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: macOS arm64 (${{ matrix.build_type }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release, Debug ]

    env:
      SCCACHE_DIR: /Users/runner/Library/Caches/Mozilla.sccache
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Homebrew dependencies
        run: |
          brew install --quiet cmake ninja pkgconf freetype srt sccache
          sccache --version

      - name: Restore sccache cache
        uses: actions/cache@v4
        with:
          path: /Users/runner/Library/Caches/Mozilla.sccache
          key: sccache-macos-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            sccache-macos-${{ matrix.build_type }}-

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
          key: vcpkg-macos-arm64-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-macos-arm64-

      - name: Zero sccache statistics
        run: sccache --zero-stats || true

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DCMAKE_PREFIX_PATH="/opt/homebrew" \
            -DVLC_SUBTITLE_METAL=ON \
            -DVLC_SUBTITLE_ENABLE_SCCACHE=ON

      - name: Build plugin
        run: |
          cmake --build build --target suboffline_plugin --parallel

      - name: Show sccache statistics
        run: sccache --show-stats

      - name: Verify build artifacts
        run: |
          ls -la build/plugin/
          test -f build/plugin/libsuboffline_plugin.dylib

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vlc-subtitle-macos-arm64-${{ matrix.build_type }}
          path: build/plugin/
          if-no-files-found: error
