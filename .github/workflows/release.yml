name: Release

on:
  push:
    branches:
      - 'v*.*.x'
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  get-version:
    name: Determine Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          REF="${{ github.ref }}"
          PRERELEASE="false"

          if [[ "${REF}" == refs/tags/v* ]]; then
            TAG_NAME="${REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
          elif [[ "${REF}" == refs/tags/* ]]; then
            TAG_NAME="${REF#refs/tags/}"
            VERSION="${TAG_NAME}"
          elif [[ "${REF}" == refs/heads/v*.*.x ]]; then
            BRANCH="${REF#refs/heads/}"
            BASE_VER="${BRANCH%.x}"
            TAG_NAME="${BASE_VER}.0"
            VERSION="${BASE_VER#v}.0"
            PRERELEASE="true"
          elif [[ "${REF}" == refs/heads/release/* ]]; then
            BRANCH="${REF#refs/heads/release/}"
            VERSION="${BRANCH#v}"
            TAG_NAME="v${VERSION}"
          else
            VERSION="1.0.0"
            TAG_NAME="v${VERSION}"
          fi

          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            PRERELEASE="true"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Determined Version: ${VERSION}, Tag: ${TAG_NAME}, Pre-release: ${PRERELEASE}"

  build-windows:
    name: Windows x64
    needs: [ get-version ]
    runs-on: windows-2022

    env:
      SCCACHE_DIR: C:/Users/runneradmin/AppData/Local/Mozilla/sccache
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Import Visual Studio env vars
        run: py -3 .github/workflows/ci-windows.py import_vs_env x64

      - name: Install sccache
        run: |
          SCCACHE_VER="v0.9.1"
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VER}/sccache-${SCCACHE_VER}-x86_64-pc-windows-msvc.tar.gz" | \
            tar -zxf - --strip-components=1
          mkdir -p /c/tools/sccache
          mv sccache.exe /c/tools/sccache/
          echo "/c/tools/sccache" >> "$GITHUB_PATH"

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest

      - name: Restore sccache cache
        uses: actions/cache@v4
        with:
          path: C:/Users/runneradmin/AppData/Local/Mozilla/sccache
          key: sccache-windows-release-x64-${{ github.sha }}
          restore-keys: |
            sccache-windows-release-x64-

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-windows-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-x64-windows-

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G "Visual Studio 17 2022" \
            -A "x64" \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="x64-windows" \
            -DVLC_SUBTITLE_ENABLE_SCCACHE=ON

      - name: Build plugin
        run: |
          cmake --build build --config "Release" --parallel

      - name: Package Windows artifacts
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          mkdir -p dist
          DLL_PATH=$(find build/plugin -name "libsuboffline_plugin.dll" | head -n 1)
          if [[ -z "${DLL_PATH}" ]]; then
            echo "Error: libsuboffline_plugin.dll not found in build/plugin"
            exit 1
          fi
          DLL_DIR=$(dirname "${DLL_PATH}")
          echo "Packaging Windows DLLs from ${DLL_DIR}:"
          ls -la "${DLL_DIR}"/*.dll
          PKG_NAME="libsuboffline-${VERSION}-x86_64-windows.zip"
          (cd "${DLL_DIR}" && 7z a "${GITHUB_WORKSPACE}/dist/${PKG_NAME}" *.dll)
          7z l "dist/${PKG_NAME}"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: package-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  build-linux:
    name: Linux x64
    needs: [ get-version ]
    runs-on: ubuntu-22.04
    env:
      SCCACHE_DIR: /home/runner/.cache/sccache
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvlc-dev \
            libvlccore-dev \
            libopenblas-dev \
            pkg-config

      - name: Switch to GCC 15 and G++ 15
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-15 \
            --slave /usr/bin/gcov gcov /usr/bin/gcov-15
          sudo update-alternatives --set gcc /usr/bin/gcc-15
          gcc --version
          g++ --version

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest

      - name: Install sccache
        run: |
          SCCACHE_VER="v0.9.1"
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VER}/sccache-${SCCACHE_VER}-x86_64-unknown-linux-musl.tar.gz" | \
            tar -zxf - --strip-components=1
          sudo mv sccache /usr/local/bin/

      - name: Restore sccache cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/sccache
          key: sccache-linux-release-${{ github.sha }}
          restore-keys: |
            sccache-linux-release-

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
            ~/.cache/vcpkg/archives
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-linux-

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          mold-version: 2.42.1
          make-default: false

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="x64-linux" \
            -DVLC_SUBTITLE_ENABLE_SCCACHE=ON \
            -DCMAKE_LINKER_TYPE=mold

      - name: Build plugin
        run: |
          cmake --build build --target suboffline_plugin --parallel

      - name: Package Linux artifacts
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          mkdir -p dist
          cd build/plugin
          PKG_NAME="libsuboffline-${VERSION}-x86_64-linux.tar.gz"
          tar -chzf "../../dist/${PKG_NAME}" *.so*

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  build-macos:
    name: macOS arm64
    needs: [ get-version ]
    runs-on: macos-15
    env:
      SCCACHE_DIR: /Users/runner/Library/Caches/Mozilla.sccache
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Fetch submodule Git LFS objects
        run: git submodule foreach --recursive "git lfs pull || true"

      - name: Install Homebrew dependencies
        run: |
          brew install --quiet cmake ninja pkgconf freetype srt sccache onnxruntime

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest

      - name: Restore sccache cache
        uses: actions/cache@v4
        with:
          path: /Users/runner/Library/Caches/Mozilla.sccache
          key: sccache-macos-release-${{ github.sha }}
          restore-keys: |
            sccache-macos-release-

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
          key: vcpkg-macos-arm64-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-macos-arm64-

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_PREFIX_PATH="/opt/homebrew" \
            -DVLC_SUBTITLE_METAL=ON \
            -DVLC_SUBTITLE_ENABLE_SCCACHE=ON

      - name: Build plugin
        run: |
          cmake --build build --target suboffline_plugin --parallel

      - name: Package macOS artifacts
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          mkdir -p dist
          cd build/plugin
          PKG_NAME="libsuboffline-${VERSION}-aarch64-apple-darwin.tar.gz"
          tar -chzf "../../dist/${PKG_NAME}" *.*
          # Also create arm64-apple-darwin and x86_64-apple-darwin aliases for compatibility
          cp "../../dist/${PKG_NAME}" "../../dist/libsuboffline-${VERSION}-arm64-apple-darwin.tar.gz"
          cp "../../dist/${PKG_NAME}" "../../dist/libsuboffline-${VERSION}-x86_64-apple-darwin.tar.gz"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: package-macos-arm64
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [ get-version, build-windows, build-linux, build-macos ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display package list
        run: |
          ls -la release-assets/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.get-version.outputs.tag_name }}
          PRERELEASE: ${{ needs.get-version.outputs.prerelease }}
        run: |
          FLAGS=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            FLAGS+=("--prerelease")
          fi

          # Extract notes from CHANGELOG.md if matching section exists
          NOTES_FILE=""
          if [[ -f CHANGELOG.md ]]; then
            NOTES="$(awk "/^## ${TAG_NAME}/ {x=1; next} /^## v[0-9]/ { x=0 } x" CHANGELOG.md | sed '/./,$!d')"
            if [[ -n "${NOTES}" ]]; then
              echo "${NOTES}" > release-notes.md
              NOTES_FILE="release-notes.md"
            fi
          fi

          if gh release view "${TAG_NAME}" &>/dev/null; then
            echo "Release ${TAG_NAME} already exists. Uploading assets..."
            gh release upload "${TAG_NAME}" release-assets/* --clobber
          else
            echo "Creating new release ${TAG_NAME}..."
            if [[ -n "${NOTES_FILE}" ]]; then
              gh release create "${TAG_NAME}" \
                release-assets/* \
                --title "${TAG_NAME}" \
                --notes-file "${NOTES_FILE}" \
                "${FLAGS[@]}"
            else
              gh release create "${TAG_NAME}" \
                release-assets/* \
                --title "${TAG_NAME}" \
                --generate-notes \
                "${FLAGS[@]}"
            fi
          fi
